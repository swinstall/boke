{{ define "main" }}
<article>
  <header>
    <h1>{{ .Title }}</h1>
    <p class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ with .Params.author }} &middot; {{ . }}{{ end }}
      {{ with .Params.tags }} &middot; {{ range . }}<span class="tag">{{ . }}</span>{{ end }}{{ end }}
    </p>
  </header>
  <div class="content">{{ .Content }}</div>
</article>
{{ end }}
